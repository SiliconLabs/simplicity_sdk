#
# esf.properties
#
# This files lists Studio SDK properties pertaining to the ZigBee stack.
#
# The version=8.2.2.0
# release branch, or it should be set to 0.0.0 otherwise. This is the
# version that Studio displays for the loaded stack.
#

id=com.silabs.sdk.stack.znet
version=8.2.2.0
label=EmberZNet SDK
description=Silicon Labs EmberZNet SDK
prop.subLabel=EmberZNet\\ 8.2.2.0

prop.partCompatibility=.*host.* .*rm21.* .*efr32m[gr]2.* .*mgm2.* .*simg301.*

prop.file.templatesFile=zigbee_wwah_production_templates.xml zigbee_smart_energy_production_templates.xml zigbee_smart_energy_internal_templates.xml zigbee_sleepy_to_sleepy_production_templates.xml zigbee_pro_compliance_internal_templates.xml zigbee_dmp_gp_proxy_production_templates.xml zigbee_development_templates.xml zigbee_experimental_templates.xml zigbee_evaluation_templates.xml zigbee_production_templates.xml zigbee_internal_templates.xml
prop.file.docsFile=documentation/slEmberZNet_docContent.xml
prop.file.demosFile=zigbee_production_demos.xml zigbee_experimental_demos.xml zigbee_evaluation_demos.xml zigbee_internal_demos.xml

prop.file.zcl.zigbeeZclJsonFile=../../app/zcl/zcl-zap.json
prop.file.zcl.zigbeeTemplateJsonFile=app/framework/gen-template/gen-templates.json

prop.protocolKey=znet
