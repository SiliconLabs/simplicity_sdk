id=com.silabs.sdk.stack.sisdk

version=2025.6.3

label=Simplicity SDK Suite
description=Simplicity SDK Suite

#names for the studio package manager
pkg_label=Simplicity Platform
pkg_description=Silicon Labs Simplicity Platform

#Build Information
codeQuality=GA
buildNumber=0

# Look in these locations for extra properties
#   note that the single .properties input is a hack so that this will work while the stacks are updated
extendedProperties=app/bluetooth/ccc.properties protocol/bluetooth/esf.properties util/third_party/find_my/find_my.properties app/amazon/app_amazon.properties .studio/efm32.properties app/bluetooth/esf.properties app/btmesh/btmesh.properties app/rail/esf.properties app/connect/esf.properties app/common/app_common.properties platform/compute/compute.properties platform/bootloader/esf.properties platform/halconfig/halconfig.properties platform/base/base.properties platform/micrium_os/micrium-krnx.properties protocol/openthread/esf.properties protocol/zigbee/esf.properties protocol/multiprotocol/esf.properties protocol/z-wave/zwave.properties protocol/usb/usb.properties hardware/kit/kit.properties hardware/reference_design/ref_design.properties util/plugin/plugin.properties  app/wisun/esf.properties extension/aiml-extension/aiml.slsdk extension/wiseconnect/esf.properties extension/matter_extension/matter.slsdk extension/amazon-sidewalk/sidewalk.slsdk

# ISD options
baseDirectory=platform/base

# Ensure protocols dont break board compatibility
prop.boardCompatibility=.*

# ESF
prop.requiredFeatureLevel=esf:2;app_framework:143
prop.file.moduleDefinition=meta/modules.yaml
prop.supportModules=true
prop.useAdditionalLibraries=true

# (V)SE files
prop.file.seFirmwareFolders=util/se_release/public
